# Navigation Links
#   Homepage sections are linked with `/#<section id>` (the `id` set on each block in `content/_index.md`).
#   Standalone pages are linked with their path, e.g. `/teaching/`.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: /
    weight: 10
  - name: Research
    url: /#research
    weight: 20
  - name: Publications
    url: /publications/
    weight: 30
  - name: Projects
    url: /projects/
    weight: 40
  - name: Experience
    url: /experience/
    weight: 50
  - name: Teaching
    url: /teaching/
    weight: 60
  - name: Service
    url: /service/
    weight: 70
  - name: CV
    url: /uploads/resume.pdf
    weight: 80
