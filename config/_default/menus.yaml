# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#   desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: '#about'
    weight: 10
  - name: Experience
    url: '#experience'
    weight: 20
  - name: Publications
    url: '#featured' # 'featured' is the common name for the publication widget
    weight: 30
  - name: Projects
    url: '#projects'
    weight: 40
  - name: Awards
    url: '#accomplishments' # Links to the accomplishments widget
    weight: 50
  - name: Teaching
    url: '/teaching/' # Links to the standalone teaching page
    weight: 60
  - name: Service
    url: '/service/' # Links to the standalone service page
    weight: 70
  - name: Contact
    url: '#contact'
    weight: 80